services:
  redis-node-0:
    image: redis:6.2
    network_mode: host
    command: >-
      redis-server
      --port 30001
      --cluster-enabled yes
      --cluster-config-file /data/nodes.conf
      --cluster-node-timeout 5000
      --requirepass passw0rd
      --masterauth passw0rd
      --appendonly yes
      --dir /data
    volumes:
      - redis-data-0:/data

  redis-node-1:
    image: redis:6.2
    network_mode: host
    command: >-
      redis-server
      --port 30002
      --cluster-enabled yes
      --cluster-config-file /data/nodes.conf
      --cluster-node-timeout 5000
      --requirepass passw0rd
      --masterauth passw0rd
      --appendonly yes
      --dir /data
    volumes:
      - redis-data-1:/data

  redis-node-2:
    image: redis:6.2
    network_mode: host
    command: >-
      redis-server
      --port 30003
      --cluster-enabled yes
      --cluster-config-file /data/nodes.conf
      --cluster-node-timeout 5000
      --requirepass passw0rd
      --masterauth passw0rd
      --appendonly yes
      --dir /data
    volumes:
      - redis-data-2:/data

  redis-node-3:
    image: redis:6.2
    network_mode: host
    command: >-
      redis-server
      --port 30004
      --cluster-enabled yes
      --cluster-config-file /data/nodes.conf
      --cluster-node-timeout 5000
      --requirepass passw0rd
      --masterauth passw0rd
      --appendonly yes
      --dir /data
    volumes:
      - redis-data-3:/data

  redis-node-4:
    image: redis:6.2
    network_mode: host
    command: >-
      redis-server
      --port 30005
      --cluster-enabled yes
      --cluster-config-file /data/nodes.conf
      --cluster-node-timeout 5000
      --requirepass passw0rd
      --masterauth passw0rd
      --appendonly yes
      --dir /data
    volumes:
      - redis-data-4:/data

  redis-node-5:
    image: redis:6.2
    network_mode: host
    command: >-
      redis-server
      --port 30006
      --cluster-enabled yes
      --cluster-config-file /data/nodes.conf
      --cluster-node-timeout 5000
      --requirepass passw0rd
      --masterauth passw0rd
      --appendonly yes
      --dir /data
    volumes:
      - redis-data-5:/data

  cluster-init:
    image: redis:6.2
    network_mode: host
    depends_on:
      - redis-node-0
      - redis-node-1
      - redis-node-2
      - redis-node-3
      - redis-node-4
      - redis-node-5
    restart: "no"
    entrypoint: ["bash", "-c"]
    command:
      - |
        echo 'Waiting for redis nodes...'
        for port in 30001 30002 30003 30004 30005 30006; do
          until redis-cli -p $$port -a passw0rd ping 2>/dev/null | grep -q PONG; do
            sleep 1
          done
          echo "127.0.0.1:$$port ready"
        done
        echo 'Creating cluster...'
        echo yes | redis-cli -a passw0rd --cluster create 127.0.0.1:30001 127.0.0.1:30002 127.0.0.1:30003 127.0.0.1:30004 127.0.0.1:30005 127.0.0.1:30006 --cluster-replicas 1
        echo 'Verifying...'
        redis-cli -p 30001 -a passw0rd cluster info
        redis-cli -p 30001 -a passw0rd cluster nodes

volumes:
  redis-data-0:
  redis-data-1:
  redis-data-2:
  redis-data-3:
  redis-data-4:
  redis-data-5:

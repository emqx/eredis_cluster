name: Run test suites

on:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        otp:
          - 25.1
        rebar3:
          - 3.23.0
    steps:
      - uses: actions/checkout@v3
      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ matrix.otp }}
          rebar3-version: ${{ matrix.rebar3 }}
      - name: setup redis cluster
        run: |
          docker compose up -d
          echo "Waiting for cluster init..."
          for i in $(seq 1 60); do
            if docker compose exec -T redis-node-0 redis-cli -a passw0rd cluster info 2>/dev/null | grep -q 'cluster_state:ok'; then
              echo "Cluster is ready"
              break
            fi
            echo "Waiting... ($i/60)"
            sleep 2
          done
          docker compose exec -T redis-node-0 redis-cli -a passw0rd cluster info
          docker compose exec -T redis-node-0 redis-cli -a passw0rd cluster nodes
      - name: eunit
        run: rebar3 eunit -v -c
      - name: cover report
        run: rebar3 cover -v
      - uses: actions/upload-artifact@v4
        with:
          name: cover
          path: _build/test/cover
      - name: teardown redis cluster
        if: always()
        run: docker compose down || true
